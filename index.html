<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wedding of Razel & Christian</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&family=Montserrat:wght@200;400&display=swap" rel="stylesheet">

    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Mayamang Navy Blue Gradient Background na may Lalim */
            background: radial-gradient(circle at center, #0d1b2a 0%, #08111c 70%, #04080f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            position: relative;
        }

        /* 1. MGA LIVE FLOATING PARTICLES (GOLD DUST) */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(212,175,55,1) 0%, rgba(212,175,55,0) 70%);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
            animation: floatUp linear infinite;
            opacity: 0;
        }

        /* Iba't ibang laki at bagsak ng gold particles */
        .particle:nth-child(1) { left: 10%; width: 4px; height: 4px; animation-duration: 12s; animation-delay: 1s; }
        .particle:nth-child(2) { left: 25%; width: 6px; height: 6px; animation-duration: 15s; animation-delay: 3s; }
        .particle:nth-child(3) { left: 45%; width: 3px; height: 3px; animation-duration: 10s; animation-delay: 0s; }
        .particle:nth-child(4) { left: 65%; width: 5px; height: 5px; animation-duration: 18s; animation-delay: 5s; }
        .particle:nth-child(5) { left: 80%; width: 7px; height: 7px; animation-duration: 14s; animation-delay: 2s; }
        .particle:nth-child(6) { left: 90%; width: 4px; height: 4px; animation-duration: 16s; animation-delay: 4s; }

        @keyframes floatUp {
            0% { transform: translateY(105vh) translateX(0) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; transform: translateY(50vh) translateX(20px) scale(1); }
            100% { transform: translateY(-5vh) translateX(-20px) scale(0.5); opacity: 0; }
        }

        /* 2. ELEGANT GOLD BORDER FRAME */
        .luxury-frame {
            position: absolute;
            top: 20px;
            bottom: 20px;
            left: 20px;
            right: 20px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            pointer-events: none;
            z-index: 2;
        }

        .luxury-frame::before {
            content: '';
            position: absolute;
            top: 10px;
            bottom: 10px;
            left: 10px;
            right: 10px;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        /* Corner accents para sa geometric frame */
        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 3px solid #d4af37;
            z-index: 3;
        }
        .top-left { top: 15px; left: 15px; border-right: none; border-bottom: none; }
        .top-right { top: 15px; right: 15px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 15px; left: 15px; border-right: none; border-top: none; }
        .bottom-right { bottom: 15px; right: 15px; border-left: none; border-top: none; }

        /* 3. MAIN CARD CONTAINER (WEDDING LOGO) */
        .wedding-card {
            text-align: center;
            z-index: 10;
            padding: 40px;
            max-width: 700px;
            width: 90%;
            animation: cardEntrance 2.5s ease-out forwards;
            background: rgba(13, 27, 42, 0.4); /* Malabong salamin effect */
            backdrop-filter: blur(5px);
            border-radius: 15px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        @keyframes cardEntrance {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        /* TEXT DESIGN AND TYPOGRAPHY */
        .sub-title {
            font-family: 'Cinzel', serif;
            color: #e0e1dd;
            font-size: 14px;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        /* Ang Main Big Monogram "R&C" */
        .monogram-box {
            position: relative;
            display: inline-block;
            margin: 20px 0;
        }
