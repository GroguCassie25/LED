<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Monogram LED Wall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0a07; /* Dark elegant base */
            font-family: 'Cinzel', serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 1. Animated Bokeh Background */
        .background-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            filter: blur(8px);
            opacity: 0.6;
        }

        /* 2. Main Container (16:9 Aspect Ratio Safe Zone) */
        .led-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* 3. Gold Monogram Ring & Animation */
        .monogram-circle {
            position: relative;
            width: 45vh;
            height: 45vh;
            border: 3px solid transparent;
            border-image: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c) 1;
            border-radius: 50%; /* Note: border-image resets radius, clip-path keeps it round */
            clip-path: circle(50% at 50% 50%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            animation: fadeInRing 2.5s ease-out forwards;
            box-shadow: 0 0 30px rgba(191, 149, 63, 0.2);
        }

        /* 4. Typography Styles */
        .initials {
            font-family: 'Great Vibes', cursive;
            font-size: 16vh;
            background: linear-gradient(to right, #c5a059, #fdf8c7, #b99037);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 1vh;
            opacity: 0;
            animation: fadeInText 2s ease-out 1.5s forwards;
        }

        .full-names {
            font-size: 2.5vh;
            color: #e6dfd3;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            font-weight: 400;
            opacity: 0;
            animation: fadeInText 2s ease-out 2.5s forwards;
            white-space: nowrap;
        }

        /* CSS Animations */
        @keyframes fadeInRing {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeInText {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <canvas class="background-canvas" id="bokehCanvas"></canvas>

    <div class="led-container">
        <div class="monogram-circle">
            <div class="initials">G&K</div>
            <div class="full-names">Gary & Krizzell</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bokehCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        const particleCount = 40;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 20 + 10;
                this.speedY = -(Math.random() * 0.3 + 0.1);
                this.opacity = Math.random() * 0.5 + 0.1;
                // Soft warm cream/gold tones
                this.color = `rgba(${Math.floor(Math.random() * 40 + 215)}, ${Math.floor(Math.random() * 40 + 185)}, 140, ${this.opacity})`;
            }
            update() {
                this.y += this.speedY;
                if (this.y + this.radius < 0) {
                    this.y = canvas.height + this.radius;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
