<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razel & Christian Wedding Monogram</title>
    <style>
        /* Base Setup & Fullscreen Layout */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0200;
            font-family: 'Playfair Display', 'Georgia', serif;
        }

        /* Ambient Glowing Background (Warm Light & Purple Tones) */
        .led-background {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #fff7e6 0%, #f7d08a 30%, #cca262 60%, #3d1b40 90%, #0b0200 100%);
            opacity: 0.95;
            z-index: 1;
        }

        /* Canvas layer for the drifting bokeh lights */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Central Monogram Container */
        .monogram-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3;
            width: 90vh;
            height: 90vh;
            max-width: 90vw;
            max-height: 90vw;
        }

        /* Golden Oval Ring with Purple/Pink Floral Watercolor Accents */
        .floral-ring {
            position: absolute;
            width: 75%;
            height: 95%;
            border: 8px double rgba(212, 175, 55, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 223, 128, 0.5), inset 0 0 30px rgba(255, 223, 128, 0.3);
            /* Simulating watercolor floral clusters at the top and bottom using layered gradients */
            background: 
                radial-gradient(circle at 50% 0%, rgba(186, 85, 211, 0.5) 0%, rgba(138, 43, 226, 0.3) 15%, transparent 35%),
                radial-gradient(circle at 45% 3%, rgba(255, 105, 180, 0.4) 0%, transparent 20%),
                radial-gradient(circle at 55% 2%, rgba(147, 112, 219, 0.4) 0%, transparent 20%),
                radial-gradient(circle at 50% 100%, rgba(186, 85, 211, 0.5) 0%, rgba(138, 43, 226, 0.3) 15%, transparent 35%),
                radial-gradient(circle at 47% 97%, rgba(255, 105, 180, 0.4) 0%, transparent 20%),
                radial-gradient(circle at 53% 98%, rgba(147, 112, 219, 0.4) 0%, transparent 20%);
            animation: slowGlow 6s ease-in-out infinite alternate;
        }

        /* Typography & Text Styling */
        .text-wrap {
            position: relative;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: -20px;
        }

        /* Large Script Initials (R & C) */
        .initials {
            font-family: 'Great Vibes', 'Edwardian Script ITC', 'Brush Script MT', cursive;
            font-size: 26vh;
            color: #1e1a17;
            line-height: 0.85;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.6);
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Golden ampersand symbol style */
        .ampersand {
            font-size: 10vh;
            font-family: 'Playfair Display', serif;
            color: #d4af37;
            margin: 0 -20px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4), 1px 1px 1px rgba(0,0,0,0.2);
            font-style: italic;
        }

        /* Clean Roman serif full names below */
        .names {
            font-size: 4.5vh;
            font-weight: 500;
            color: #2b2520;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-top: 4vh;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
            border-top: 1px solid rgba(212, 175, 55, 0.4);
            padding-top: 2vh;
            width: 80%;
        }

        /* Subtle pulsating illumination effect for the ring */
        @keyframes slowGlow {
            0% {
                box-shadow: 0 0 30px rgba(255, 223, 128, 0.4), inset 0 0 20px rgba(255, 223, 128, 0.2);
                transform: scale(1);
            }
            100% {
                box-shadow: 0 0 50px rgba(255, 223, 128, 0.7), inset 0 0 40px rgba(255, 223, 128, 0.4);
                transform: scale(1.01);
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <div class="led-background"></div>
    <canvas id="bokehCanvas"></canvas>

    <div class="monogram-container">
        <div class="floral-ring"></div>
        <div class="text-wrap">
            <div class="initials">
                <span>R</span>
                <span class="ampersand">&</span>
                <span>C</span>
            </div>
            <div class="names">Razel & Christian</div>
        </div>
    </div>

    <script>
        // Smoothly animated Canvas Bokeh Engine
        const canvas = document.getElementById('bokehCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const particleCount = 45; // Balance between rich visuals and performance

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class BokehParticle {
            constructor() {
                this.reset();
                // Randomize initial placement so elements aren't jumping onto the screen at launch
                this.y = Math.random() * canvas.height;
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.radius = Math.random() * 45 + 15; // Diverse light sizing
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = -(Math.random() * 0.4 + 0.1); // Slow drifting upward motion
                this.opacity = Math.random() * 0.4 + 0.1;
                this.fadeSpeed = Math.random() * 0.002 + 0.001;
                
                // Color palette shifting between golden-orange glow and soft magical purple highlights
                const colors = [
                    `rgba(255, 244, 214, ${this.opacity})`, // Warm ivory
                    `rgba(253, 218, 142, ${this.opacity})`, // Soft amber
                    `rgba(244, 179, 194, ${this.opacity - 0.05})`, // Blush rose
                    `rgba(216, 191, 216, ${this.opacity - 0.05})`  // Light thistle/lavender
                ];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Slowly alternate opacity levels to create a twinkling overlay
                if (this.y < -this.radius || this.x < -this.radius || this.x > canvas.width + this.radius) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                // Radial gradient fill gives each floating lens its soft, blurry edge characteristic of bokeh photography
                let gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                gradient.addColorStop(0, this.color);
                gradient.addColorStop(0.8, this.color);
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                
                ctx.fillStyle = gradient;
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            for (let i = 0; i < particleCount; i++) {
                particles.push(new BokehParticle());
            }
        }

        function animate() {
            // Using a soft clear frame to maintain smooth trails behind lighting assets
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>
</html>
