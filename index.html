<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razel & Christian Wedding Monogram</title>
    <style>
        /* Reset and Fullscreen Stage */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c040a;
            font-family: 'Cinzel', 'Playfair Display', serif;
        }

        /* Video Background Container (Matches the video's depth perfectly) */
        .video-bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }
        .video-bg-container iframe {
            width: 100vw;
            height: 56.25vw; /* 16:9 Aspect Ratio */
            min-height: 100vh;
            min-width: 177.77vh; /* Maintains proportion */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0.85;
            filter: contrast(1.1) brightness(0.9);
        }

        /* Subtle dark vignette overlay to make the center monogram pop */
        .vignette-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(12, 4, 10, 0.4) 80%, rgba(12, 4, 10, 0.85) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Central Monogram Stage */
        .monogram-stage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 800px;
            height: 800px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
        }

        /* The Gold Oval & Lavender Floral Wreath Framework */
        .wreath-framework {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('https://i.ibb.co/6R0n7YgR/floral-gold-wreath.png') center center no-repeat;
            background-size: contain;
            animation: gentlePulse 8s ease-in-out infinite alternate;
            filter: drop-shadow(0px 10px 25px rgba(0, 0, 0, 0.3));
        }

        /* Typography Wrapper */
        .text-container {
            position: relative;
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            padding-bottom: 20px; /* Perfectly balances the optical center */
        }

        /* Initials Layout (R & C) */
        .initials-row {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Great Vibes', cursive;
            font-size: 185px;
            color: #1a1512;
            line-height: 1;
            margin-bottom: -15px;
            text-shadow: 1px 1px 1px rgba(255, 255, 255, 0.4);
        }

        /* The Interlocking Golden Ampersand */
        .ampersand {
            font-family: 'Playfair Display', serif;
            font-size: 65px;
            font-style: italic;
            font-weight: 600;
            color: #caa463; /* Authentic metallic gold tone */
            margin: 0 -22px;
            z-index: 5;
            position: relative;
            top: 15px; /* Pulls it down to interlock gracefully between the letters */
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.15);
        }

        /* Divider Line matching the original image */
        .divider {
            width: 160px;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(202, 164, 99, 0.6), transparent);
            margin: 15px 0 25px 0;
        }

        /* Full Names Formatting */
        .full-names {
            font-family: 'Cinzel', 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 500;
            color: #241e1a;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            text-shadow: 1px 1px 1px rgba(255, 255, 255, 0.3);
            padding-left: 0.3em; /* Offsets letter-spacing to ensure absolute center */
        }

        /* Gentle atmospheric animation for the wreath */
        @keyframes gentlePulse {
            0% { transform: scale(0.98); opacity: 0.95; }
            100% { transform: scale(1.02); opacity: 1; }
        }
    </style>
