<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razel & Christian Elegant Monogram</title>
    <style>
        /* Stage Reset & Fullscreen Management */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d050a;
            font-family: 'Playfair Display', serif;
        }

        /* Ambient Video Background Layer */
        .led-video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }
        .led-video-container iframe {
            width: 100vw;
            height: 56.25vw; /* 16:9 Aspect Ratio Alignment */
            min-height: 100vh;
            min-width: 177.77vh;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0.88;
            filter: brightness(0.95) contrast(1.05);
        }

        /* Vignette mask to blend edges naturally onto an LED wall stage */
        .stage-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(13, 5, 10, 0.3) 80%, rgba(13, 5, 10, 0.8) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Monogram Frame Positioning */
        .monogram-centerpiece {
            position: absolute;
            top: 46%; /* Slightly raised to match the vertical center balance of your photo */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 780px;
            height: 780px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
        }

        /* High-fidelity Floral & Gold Double Ring Asset */
        .floral-wreath-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('https://i.ibb.co/6R0n7YgR/floral-gold-wreath.png') center center no-repeat;
            background-size: contain;
            animation: slowAtmosphere 10s ease-in-out infinite alternate;
        }

        /* INTERLOCKING MONOGRAM ENGINE */
        .interlocking-logo-box {
            position: relative;
            width: 400px;
            height: 280px;
            margin-top: -40px; /* Centers group inside the oval ring */
        }

        /* Letter R: Sitting higher up and slightly to the left */
        .letter-first {
            position: absolute;
            font-family: 'Alex Brush', cursive;
            font-size: 260px;
            color: #1c1815;
            top: -40px;
            left: 10px;
            line-height: 1;
            z-index: 4;
        }

        /* The Custom Script Ampersand interlocking inside the R's loop */
        .script-ampersand {
            position: absolute;
            font-family: 'Alex Brush', cursive;
            font-size: 130px;
            color: #1c1815;
            top: 85px;
            left: 135px;
            z-index: 6; /* Layers over the R but tucks behind the C */
        }

        /* Letter C: Sitting lower down and shifted right */
        .letter-second {
            position: absolute;
            font-family: 'Alex Brush', cursive;
            font-size: 270px;
            color: #1c1815;
            top: 30px;
            left: 175px;
            line-height: 1;
            z-index: 5;
        }

        /* Subtext Label Area */
        .names-footer {
            position: absolute;
            bottom: 175px;
            width: 100%;
            text-align: center;
            z-index: 4;
        }

        /* Soft, whimsical serif typography to perfectly match 'GARY & KRIZZELL' style */
        .wedding-names {
            font-family: 'Playfair Display', serif;
            font-size: 34px;
            font-weight: 500;
            font-style: italic;
            color: #29221d;
            letter-spacing: 0.05em;
            text-shadow: 1px 1px 1px rgba(255, 255, 255, 0.4);
        }

        /* Soft pulse animation for the visual framework */
        @keyframes slowAtmosphere {
            0% { transform: scale(0.99); opacity: 0.97; }
            100% { transform: scale(1.01); opacity: 1; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="led-video-container">
        <iframe src="https://www.youtube.com/embed/4S2r6rN8b78?autoplay=1&mute=1&loop=1&playlist=4S2r6rN8b78&controls=0&showinfo=0&rel=0&modestbranding=1&iv_load_policy=3" frameborder="0" allow="autoplay; encrypted-media"></iframe>
    </div>

    <div class="stage-vignette"></div>

    <div class="monogram-centerpiece">
        <div class="floral-wreath-layer"></div>
        
        <div class="interlocking-logo-box">
            <div class="letter-first">R</div>
            <div class="script-ampersand">&</div>
            <div class="letter-second">C</div>
        </div>

        <div class="names-footer">
            <div class="wedding-names">Razel & Christian</div>
        </div>
    </div>

</body>
</html>
